    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ownedRef = ref(db, "album/owned");

    // Expõe funções pro app
    window._fbReady = false;
    window._fbOwned = {};
    window._fbUpdate = (id, val) => {
      update(ownedRef, { [id]: val });

    onValue(ownedRef, (snapshot) => {

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06080f;
      --bg2: #0b1020;
      --bg3: #111827;
      --border: #1e2d42;
      --gold: #c9a84c;
      --gold2: #f0d080;
      --green: #3dba6e;
      --red: #e03a30;
      --text: #ddd8cc;
      --muted: #5a6a80;
      --card-bg: #0d1625;
      --card-owned: #0d2218;
      --special-bg: #0f102a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: linear-gradient(160deg, #0f0a20 0%, #091530 60%, #071510 100%);
      border-bottom: 2px solid var(--gold);
      padding: 14px 18px 10px;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .header-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
    }
    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
      margin-top: 2px;
    }
    .header-pct {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--gold);
      line-height: 1;
    }
    .header-count { font-size: 11px; color: var(--muted); margin-top: 2px; text-align: right; }
    .progress-bar {
      margin-top: 10px;
      height: 4px;
      background: var(--bg3);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* NAV */
    .nav {
      display: flex;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      flex: none;
      padding: 11px 18px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 12px;
      min-width: 100px;
    }
    .search-input {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
    }
    .search-input::placeholder { color: var(--muted); }

    /* CONTENT */
    .content { padding: 0 0 80px; }

    /* GROUP PILLS */
    .group-pills {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 10px 14px;
    }
    .group-pills::-webkit-scrollbar { display: none; }
    .pill {
      flex: none;
      padding: 4px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .pill.active { border-color: var(--gold); background: #1a2538; color: var(--gold); }
    .pill.done { color: var(--green); }

    /* TEAM SECTION */
    .team-section { padding: 0 14px; }
    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .team-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-right: 8px;
    }
    .team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .team-progress { font-size: 11px; color: var(--muted); }
    .team-progress.done { color: var(--green); }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 6px;
      margin-bottom: 22px;
    }

    /* CARD */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 9px;
      cursor: pointer;
      text-align: left;
      position: relative;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .card:active { transform: scale(0.97); }
    .card.owned {
      background: var(--card-owned);
      border-color: var(--green);
    }
    .card.special { background: var(--special-bg); border-color: #2a2a5a; }
    .card.special.owned { background: var(--card-owned); border-color: var(--green); }
    .card-check {
      position: absolute;
      top: 5px;
      right: 7px;
      color: var(--green);
      font-size: 13px;
      display: none;
    }
    .card.owned .card-check { display: block; }
    .card-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold);
    }
    .card-name {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }
    .card.owned .card-name { color: #7acc99; }
    .card-sub { font-size: 9px; color: #4a5a70; }

    /* SECTION TITLE */
    .sec-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* TAGS */
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
    .tag {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 10px;
      font-size: 10px;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      color: var(--text);
      transition: background 0.15s;
    }
    .tag:active { background: #1e2d42; }
    .tag-code { color: var(--gold); margin-right: 4px; }

    /* STATUS BAR */
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.connected { background: var(--green); }

    /* LOADING */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: var(--muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* EMPTY */
    .empty { text-align: center; padding: 48px 20px; color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; }

    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>

function buildTeamStickers() {
  const all = [];
  TEAMS_DATA.forEach(team => {
    all.push({ id: `${team.code}-1`, code: `${team.code} 1`, name: "Emblema", team: team.name, group: team.group, special: true });
    team.players.slice(0, 11).forEach((p, i) => {
      all.push({ id: `${team.code}-${i+2}`, code: `${team.code} ${i+2}`, name: p, team: team.name, group: team.group, special: false });
    });
    all.push({ id: `${team.code}-13`, code: `${team.code} 13`, name: "Foto do Elenco", team: team.name, group: team.group, special: true });
    team.players.slice(11).forEach((p, i) => {
      all.push({ id: `${team.code}-${i+14}`, code: `${team.code} ${i+14}`, name: p, team: team.name, group: team.group, special: false });
    });
  });
  return all;
}

const ALL_TEAM_STICKERS = buildTeamStickers();
const GROUPS = [...new Set(TEAMS_DATA.map(t => t.group))];
const TOTAL_ALL = ALL_TEAM_STICKERS.length + FWC_STICKERS.length + CC_STICKERS.length;

// ===================== STATE =====================
let owned = {};
let view = "album";
let activeGroup = "Grupo A";
let search = "";
let connected = false;

// ===================== RENDER =====================
function $(sel) { return document.querySelector(sel); }

function totalOwned() { return Object.values(owned).filter(Boolean).length; }

function render() {
  const to = totalOwned();
  const pct = Math.round((to / TOTAL_ALL) * 100);

  const missingTeam = ALL_TEAM_STICKERS.filter(s => !owned[s.id]);
  const missingFWC = FWC_STICKERS.filter(s => !owned[s.id]);
  const missingCC = CC_STICKERS.filter(s => !owned[s.id]);
  const totalMissing = missingTeam.length + missingFWC.length + missingCC.length;

  const searchResults = search.length >= 2 ? [
    ...ALL_TEAM_STICKERS.filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || s.code.toLowerCase().includes(search.toLowerCase()) || s.team.toLowerCase().includes(search.toLowerCase())),
    ...FWC_STICKERS.filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || s.code.toLowerCase().includes(search.toLowerCase())),
    ...CC_STICKERS.filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || s.code.toLowerCase().includes(search.toLowerCase())),
  ] : [];

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-label">Panini Official</div>
          <div class="header-title">Copa do Mundo 2026</div>
        </div>
        <div>
          <div class="header-pct">${pct}%</div>
          <div class="header-count">${to} / ${TOTAL_ALL}</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="nav">
      <button class="nav-btn ${view==='album'?'active':''}" onclick="setView('album')">Álbum</button>
      <button class="nav-btn ${view==='especiais'?'active':''}" onclick="setView('especiais')">Especiais</button>
      <button class="nav-btn ${view==='faltando'?'active':''}" onclick="setView('faltando')">Faltando (${totalMissing})</button>
      <div class="search-wrap">
        <input class="search-input" id="searchInput" placeholder="Buscar código ou nome..." value="${search}" oninput="onSearch(this.value)" />
      </div>
    </div>

    <div class="content">
      ${search.length >= 2 ? renderGrid(searchResults, true) : view === 'especiais' ? renderEspeciais(missingFWC, missingCC) : view === 'faltando' ? renderFaltando(missingTeam, missingFWC, missingCC) : renderAlbum()}
    </div>

    <div class="status-bar">
      <div class="status-dot ${connected?'connected':''}"></div>
      ${connected ? 'Sincronizado com Firebase' : 'Aguardando conexão...'}
    </div>
  `;
}

function renderGrid(stickers, showSub) {
  if (!stickers.length) return '<div class="empty">Nenhum resultado</div>';
  return `<div style="padding:14px"><div class="grid">${stickers.map(s => renderCard(s, showSub)).join('')}</div></div>`;
}

function renderCard(s, showSub) {
  const o = !!owned[s.id];
  const sp = s.special;
  return `<button class="card ${o?'owned':''} ${sp?'special':''}" onclick="toggle('${s.id}')">
    <span class="card-check">✓</span>
    <div class="card-code">${s.code}</div>
    ${showSub && s.team ? `<div class="card-sub">${s.team}</div>` : ''}
    <div class="card-name">${s.name}</div>
  </button>`;
}

function renderTag(s) {
  return `<button class="tag" onclick="toggle('${s.id}')"><span class="tag-code">${s.code}</span>${s.name}</button>`;
}

function renderEspeciais() {
  return `<div style="padding:14px">
    <div class="sec-title" style="color:#c9a84c">FWC — FIFA World Cup</div>
    <div class="grid">${FWC_STICKERS.map(s => renderCard(s, false)).join('')}</div>
    <div style="margin-top:20px" class="sec-title" style="color:#e03a30">CC — Coca-Cola</div>   
    <div class="grid">${CC_STICKERS.map(s => renderCard(s, false)).join('')}</div>
  </div>`;
}

function renderFaltando(missingTeam, missingFWC, missingCC) {
  let html = '<div style="padding:14px">';
  if (missingFWC.length) html += `<div class="sec-title" style="color:#c9a84c">Especiais FWC</div><div class="tags">${missingFWC.map(renderTag).join('')}</div>`;
  if (missingCC.length) html += `<div class="sec-title" style="color:#e05030;margin-top:12px">Especiais Coca-Cola</div><div class="tags">${missingCC.map(renderTag).join('')}</div>`;
  GROUPS.forEach(group => {
    const rows = TEAMS_DATA.filter(t => t.group === group).map(team => ({
      team: team.name,
      stickers: ALL_TEAM_STICKERS.filter(s => s.team === team.name && !owned[s.id])
    })).filter(r => r.stickers.length > 0);
    if (!rows.length) return;
    html += `<div style="margin-top:16px"><div class="sec-title" style="color:#c9a84c">${group}</div>`;
    rows.forEach(({ team, stickers }) => {
      html += `<div style="margin-bottom:10px"><div style="font-size:11px;color:#5a6a80;margin-bottom:5px;font-family:'Barlow Condensed',sans-serif">${team}</div><div class="tags">${stickers.map(renderTag).join('')}</div></div>`;
    });
    html += '</div>';
  });
  if (missingTeam.length === 0 && missingFWC.length === 0 && missingCC.length === 0) html += '<div class="empty">Álbum completo!</div>';
  html += '</div>';
  return html;
}

function renderAlbum() {
  const pills = GROUPS.map(g => {
    const gs = ALL_TEAM_STICKERS.filter(s => s.group === g);
    const done = gs.every(s => owned[s.id]);
    return `<button class="pill ${activeGroup===g?'active':''} ${done?'done':''}" onclick="setGroup('${g}')">${g.replace('Grupo ','')}${done?' ✓':''}</button>`;
  }).join('');

  const teams = TEAMS_DATA.filter(t => t.group === activeGroup).map(team => {
    const stickers = ALL_TEAM_STICKERS.filter(s => s.team === team.name);
    const to = stickers.filter(s => owned[s.id]).length;
    const done = to === stickers.length;
    return `<div class="team-header">
      <div><span class="team-code">${team.code}</span><span class="team-name">${team.name}</span></div>
      <div class="team-progress ${done?'done':''}">${to}/${stickers.length}${done?' ✓':''}</div>
    </div>
    <div class="grid">${stickers.map(s => renderCard(s, false)).join('')}</div>`;
  }).join('');

  return `<div class="group-pills">${pills}</div><div class="team-section">${teams}</div>`;
}

// ===================== ACTIONS =====================
window.setView = (v) => { view = v; search = ""; render(); };
window.setGroup = (g) => { activeGroup = g; render(); };
window.onSearch = (v) => { search = v; render(); setTimeout(() => { const el = document.getElementById('searchInput'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }, 0); };
window.toggle = (id) => {
  const newVal = !owned[id];
  owned[id] = newVal;
  render();
  if (window._fbUpdate) window._fbUpdate(id.replace(/\./g,'_'), newVal);
};

// ===================== FIREBASE SYNC =====================
window.addEventListener("fb-update", () => {
  // Normalize keys back (Firebase doesn't allow dots)
  const raw = window._fbOwned || {};
  owned = {};
  Object.entries(raw).forEach(([k, v]) => { owned[k.replace(/_/g, '.')] = v; });
  connected = true;
  render();
});

// Render inicial enquanto Firebase não chegou
render();

// Checa se Firebase está configurado
setTimeout(() => {
  if (!window._fbReady) {
    document.getElementById("app").innerHTML += `
      <div style="position:fixed;bottom:60px;left:0;right:0;background:#1a0a0a;border-top:1px solid #e03a30;padding:12px 18px;font-size:12px;color:#e07070;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-align:center">
        Firebase não configurado — edite o index.html e cole suas credenciais
      </div>`;
  }
}, 3000);
</script>
</body>
</html>
